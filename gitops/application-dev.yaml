# Reference copy — the deployed file lives in infra-gitops
# `bootstrap/applications/services/target-service-dev.yaml`. service-ci bumps
# `.spec.source.targetRevision` and `parent.image.tag` there on every push to main.
# The pinned tag below is the bootstrap value (repo HEAD at scaffold time); the chart
# version 1.0.0-<sha> only exists in Zot after the first service-ci run.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: target-service-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  project: scantinel-dev
  source:
    repoURL: registry.internal.stacktixs.com
    chart: charts/target-service
    targetRevision: 1.0.0-c846a40
    helm:
      valuesObject:
        parent:
          # Gateway plugin stamps the trusted X-App-Id (backends 400 without it).
          # Middleware CRD lives in platform-dev; cross-namespace reference.
          ingress:
            gatewayPluginEnabled: true
            gatewayPluginNamespace: platform-dev
          image:
            tag: "c846a40"
          environment: dev
          host: dev.scantinel.ai
          serviceMonitor:
            namespaceSelector:
              matchNames:
                - scantinel-dev
      releaseName: target-service
  destination:
    server: https://kubernetes.default.svc
    namespace: scantinel-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
